apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mysql.fullname" . }}-test"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: mysql-client
      image: mysql:8.4
      command: ['sh', '-c', 'sleep 3']
  restartPolicy: Never
