apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mysql.fullname" . }}-test-connection"
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: busybox
      command:
        - sh
        - -c
        - >
          nc -zv {{ include "mysql.fullname" . }} {{ .Values.service.port }}
