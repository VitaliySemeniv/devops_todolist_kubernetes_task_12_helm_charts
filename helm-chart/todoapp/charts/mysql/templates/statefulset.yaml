apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ .Chart.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Chart.Name }} }
  template:
    metadata:
      labels: { app: {{ .Chart.Name }} }
    spec:
      tolerations:
      - key: {{ .Values.affinity.toleration.key }}
        operator: "Equal"
        value: {{ .Values.affinity.toleration.value | quote }}
        effect: {{ .Values.affinity.toleration.effect | quote }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.affinity.nodeAffinity.key }}
                operator: In
                values: {{ toYaml .Values.affinity.nodeAffinity.values | nindent 16 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: {{ .Chart.Name }} }
            topologyKey: kubernetes.io/hostname
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Chart.Name }}-auth, key: MYSQL_ROOT_PASSWORD } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: {{ .Chart.Name }}-auth, key: MYSQL_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Chart.Name }}-auth, key: MYSQL_PASSWORD } }
        ports: [{ name: mysql, containerPort: 3306 }]
        volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
        resources:
          requests: { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
          limits:   { cpu: {{ .Values.resources.limits.cpu }},   memory: {{ .Values.resources.limits.memory }} }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: {{ .Values.pvc.storage }} } }
